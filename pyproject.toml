[project]
name = "data-platform-playbook"
version = "0.1.0"
description = "A modular, AI-native local data platform playbook."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "kafka-python-ng>=2.2.0",
    "pydantic>=2.7.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "requests>=2.31.0",
    "faker>=24.0.0",
    "flask>=3.0.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "duckdb>=0.10.0",
    "weaviate-client>=4.5.0",
    "ollama>=0.1.7",
    "langchain>=0.1.0",
    "llama-index>=0.10.0",
    "soda-core-contracts>=3.0.0",
    "great-expectations>=0.18.0",
    "polars>=0.20.0",
    "motor>=3.3.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "cbor2>=5.6.0",
    "pyiceberg>=0.6.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
