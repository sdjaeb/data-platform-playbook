[project]
name = "data-platform-playbook"
version = "0.1.0"
description = "A modular, AI-native local data platform playbook."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "kafka-python-ng>=2.2.0",
    "pydantic>=2.7.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "requests>=2.31.0",
    "faker>=24.0.0",
    "flask>=3.0.0",
    "dagster",
    "dagster-webserver",
    "duckdb",
    "weaviate-client",
    "ollama",
    "langchain",
    "llama-index",
    "soda-core-contracts",
    "great-expectations",
    "polars>=0.20.0",
    "motor>=3.3.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "cbor2>=5.6.0",
    "pyiceberg>=0.6.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
